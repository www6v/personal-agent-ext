# nanoMuse Docker Compose 配置

services:
  nanomuse:
    build:
      context: /home/wei/personal-agent/nanoMuse-main
      dockerfile: /home/wei/personal-agent/deploy-docker/Dockerfile
    container_name: nanomuse-web
    restart: unless-stopped
    ports:
      - "8788:8787"
    volumes:
      # 数据持久化
      - nanomuse-data:/data
      # 配置文件
      - ./config.toml:/app/config/config.toml:ro
    environment:
      - NANOMUSE_SERVER_TOKEN=nanomuse-remote-token-2026
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nanomuse-data:
    driver: local
